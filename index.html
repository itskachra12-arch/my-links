<!DOCTYPE html>
<html>

<head>
<title>Creative Toolbox</title>

<style>

body{

}

}

width:100%;
padding:12px;
font-size:18px;
margin-bottom:30px;
}

.grid{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.card{
width:100px;
text-align:center;
}

.card img{
width:60px;
height:60px;
border-radius:10px;
}

a{
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<input class="search" placeholder="Search tools...">

<h1>Creative Toolbox</h1>

<p>My video editing and design resources.</p>

<h2>AI Tools</h2>

<div class="grid">

<div class="card">
<a href="https://chat.openai.com" target="_blank" rel="noopener noreferrer">
<img src="https://www.google.com/s2/favicons?sz=128&domain=openai.com">
<p>ChatGPT</p>
</a>
</div>

<div class="card">
<a href="https://chat.openai.com" target="_blank" rel="noopener noreferrer">
<img src="https://www.google.com/s2/favicons?sz=128&domain=runwayml.com">
<p>Runway</p>
</a>
</div>

</div>

</body>
</html>
