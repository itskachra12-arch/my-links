<!DOCTYPE html>
<html>
<head>
<title>Creative Toolbox</title>

<style>

body{
background:#0a0a0a;
color:#e6e6e6;
font-family:Arial,Helvetica,sans-serif;
padding:40px;
}

h1{
font-size:34px;
margin-bottom:20px;
}

h2{
margin-top:40px;
}

input,select,button{
background:#1a1a1a;
color:white;
border:none;
padding:8px;
border-radius:5px;
margin-bottom:10px;
}

button{
cursor:pointer;
}

.search{
width:100%;
padding:12px;
font-size:16px;
margin-bottom:25px;
}

.grid{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.card{
width:160px;
background:#161616;
border-radius:10px;
padding:12px;
text-align:center;
position:relative;
}

.card img{
width:48px;
height:48px;
margin-bottom:8px;
}

.delete{
position:absolute;
top:6px;
right:6px;
background:#ff3b3b;
border:none;
border-radius:50%;
width:20px;
height:20px;
color:white;
font-size:12px;
}

.favorite{
position:absolute;
top:6px;
left:6px;
}

.section{
margin-top:35px;
}

.categoryHeader{
display:flex;
align-items:center;
gap:10px;
}

.info{
cursor:pointer;
color:#aaa;
}

.adminControls{
margin-bottom:20px;
}

.hidden{
display:none;
}

a{
text-decoration:none;
color:white;
}

</style>
</head>

<body>

<h1>Creative Toolbox</h1>

<input id="searchInput" class="search" placeholder="Search tools...">

<div class="adminControls">
<button onclick="toggleAdmin()">Admin Mode</button>
<button onclick="exportTools()">Export</button>
<input type="file" onchange="importTools(event)">
</div>

<!-- PUBLIC FAVORITES -->

<div class="section">
<h2>⭐ Public Favorites</h2>
<div class="grid" id="publicFavorites"></div>
</div>

<!-- PUBLIC CATEGORIES -->

<div id="publicCategoriesContainer"></div>

<div id="publicCategoryCreator" class="hidden">

<h3>Create Public Category</h3>

<input id="publicCatName" placeholder="Category Name">
<input id="publicCatDesc" placeholder="Category Description">

<button onclick="addPublicCategory()">Create</button>

</div>

<!-- PRIVATE FAVORITES -->

<div class="section">
<h2>⭐ Private Favorites</h2>
<div class="grid" id="privateFavorites"></div>
</div>

<!-- PRIVATE CATEGORIES -->

<div id="privateCategoriesContainer"></div>

<div id="privateCategoryCreator">

<h3>Create Private Category</h3>

<input id="privateCatName" placeholder="Category Name">

<button onclick="addPrivateCategory()">Create</button>

</div>

<!-- TOOL FORM -->

<div id="toolForm" class="hidden">

<h3>Add Tool</h3>

<input id="toolName" placeholder="Tool Name">

<input id="toolLink" placeholder="Tool Link">

<select id="toolCategory"></select>

<label>
<input type="checkbox" id="toolFav">
Favorite
</label>

<select id="toolType">
<option value="public">Public</option>
<option value="private">Private</option>
</select>

<br>

<button onclick="addTool()">Add Tool</button>

</div>

<script>

const ADMIN_PASSWORD="admin123"

let admin=false

let publicCategories=JSON.parse(localStorage.getItem("publicCategories"))||[]
let privateCategories=JSON.parse(localStorage.getItem("privateCategories"))||[]

let publicTools=JSON.parse(localStorage.getItem("publicTools"))||[]
let privateTools=JSON.parse(localStorage.getItem("privateTools"))||[]

function toggleAdmin(){

let pass=prompt("Enter admin password")

if(pass===ADMIN_PASSWORD){

admin=!admin

document.getElementById("toolForm").classList.toggle("hidden")

document.getElementById("publicCategoryCreator").classList.toggle("hidden")

alert("Admin mode "+(admin?"enabled":"disabled"))

render()

}

}

function save(){

localStorage.setItem("publicCategories",JSON.stringify(publicCategories))
localStorage.setItem("privateCategories",JSON.stringify(privateCategories))
localStorage.setItem("publicTools",JSON.stringify(publicTools))
localStorage.setItem("privateTools",JSON.stringify(privateTools))

}

function addPublicCategory(){

let name=document.getElementById("publicCatName").value.trim()
let desc=document.getElementById("publicCatDesc").value.trim()

if(!name)return

publicCategories.push({name,desc})

save()
render()

}

function addPrivateCategory(){

let name=document.getElementById("privateCatName").value.trim()

if(!name)return

privateCategories.push({name})

save()
render()

}

function deleteCategory(type,index){

if(!confirm("Delete this category and all tools inside?"))return

if(type==="public"){

let name=publicCategories[index].name

publicTools=publicTools.filter(t=>t.cat!==name)

publicCategories.splice(index,1)

}else{

let name=privateCategories[index].name

privateTools=privateTools.filter(t=>t.cat!==name)

privateCategories.splice(index,1)

}

save()
render()

}

function addTool(){

let name=document.getElementById("toolName").value.trim()
let link=document.getElementById("toolLink").value.trim()
let cat=document.getElementById("toolCategory").value
let fav=document.getElementById("toolFav").checked
let type=document.getElementById("toolType").value

if(!name||!link)return

if(!link.startsWith("http"))link="https://"+link

let tool={name,link,cat,fav}

if(type==="public")publicTools.push(tool)
else privateTools.push(tool)

save()
render()

}

function deleteTool(type,index){

if(type==="public")publicTools.splice(index,1)
else privateTools.splice(index,1)

save()
render()

}

function render(){

document.getElementById("publicCategoriesContainer").innerHTML=""
document.getElementById("privateCategoriesContainer").innerHTML=""
document.getElementById("publicFavorites").innerHTML=""
document.getElementById("privateFavorites").innerHTML=""

let select=document.getElementById("toolCategory")
select.innerHTML=""

publicCategories.forEach((c,i)=>{

let section=document.createElement("div")
section.className="section"

section.innerHTML=`
<div class="categoryHeader">
<h2>${c.name}</h2>
<span class="info" onclick="alert('${c.desc}')">ⓘ</span>
${admin?`<button onclick="deleteCategory('public',${i})">Delete</button>`:""}
</div>
<div class="grid" id="pub-${i}"></div>
`

document.getElementById("publicCategoriesContainer").appendChild(section)

let opt=document.createElement("option")
opt.value=c.name
opt.textContent="[Public] "+c.name
select.appendChild(opt)

})

privateCategories.forEach((c,i)=>{

let section=document.createElement("div")
section.className="section"

section.innerHTML=`
<div class="categoryHeader">
<h2>${c.name}</h2>
${admin?`<button onclick="deleteCategory('private',${i})">Delete</button>`:""}
</div>
<div class="grid" id="pri-${i}"></div>
`

document.getElementById("privateCategoriesContainer").appendChild(section)

let opt=document.createElement("option")
opt.value=c.name
opt.textContent="[Private] "+c.name
select.appendChild(opt)

})

publicTools.forEach((t,i)=>{

let domain=new URL(t.link).hostname

let card=document.createElement("div")
card.className="card"

card.innerHTML=`
<div class="favorite">${t.fav?"⭐":""}</div>
${admin?`<button class="delete" onclick="deleteTool('public',${i})">×</button>`:""}
<a href="${t.link}" target="_blank">
<img src="https://www.google.com/s2/favicons?sz=128&domain=${domain}">
<div>${t.name}</div>
</a>
`

let catIndex=publicCategories.findIndex(c=>c.name===t.cat)

if(catIndex>-1){

if(t.fav){

document.getElementById("publicFavorites").appendChild(card.cloneNode(true))
document.getElementById("pub-"+catIndex).prepend(card)

}else{

document.getElementById("pub-"+catIndex).appendChild(card)

}

}

})

privateTools.forEach((t,i)=>{

let domain=new URL(t.link).hostname

let card=document.createElement("div")
card.className="card"

card.innerHTML=`
<div class="favorite">${t.fav?"⭐":""}</div>
${admin?`<button class="delete" onclick="deleteTool('private',${i})">×</button>`:""}
<a href="${t.link}" target="_blank">
<img src="https://www.google.com/s2/favicons?sz=128&domain=${domain}">
<div>${t.name}</div>
</a>
`

let catIndex=privateCategories.findIndex(c=>c.name===t.cat)

if(catIndex>-1){

if(t.fav){

document.getElementById("privateFavorites").appendChild(card.cloneNode(true))
document.getElementById("pri-"+catIndex).prepend(card)

}else{

document.getElementById("pri-"+catIndex).appendChild(card)

}

}

})

}

document.getElementById("searchInput").addEventListener("input",function(){

let s=this.value.toLowerCase()

document.querySelectorAll(".card").forEach(card=>{

card.style.display=card.innerText.toLowerCase().includes(s)?"block":"none"

})

})

function exportTools(){

let data={
publicCategories,
privateCategories,
publicTools,
privateTools
}

let blob=new Blob([JSON.stringify(data)],{type:"application/json"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="toolbox.json"

a.click()

}

function importTools(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let data=JSON.parse(reader.result)

publicCategories=data.publicCategories||[]
privateCategories=data.privateCategories||[]
publicTools=data.publicTools||[]
privateTools=data.privateTools||[]

save()
render()

}

reader.readAsText(file)

}

render()

</script>

</body>
</html>
