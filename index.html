<!DOCTYPE html>
<html>

<head>
<title>Creative Toolbox</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:40px;
}

h1{
font-size:40px;
}

.search{
width:100%;
padding:12px;
font-size:18px;
margin-bottom:30px;
}

.grid{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.card{
width:100px;
text-align:center;
}

.card img{
width:60px;
height:60px;
border-radius:10px;
}

a{
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<input class="search" placeholder="Search tools...">

<h1>Creative Toolbox</h1>

<p>My video editing and design resources.</p>

<h2>AI Tools</h2>

<div class="grid">

<div class="card">
<a href="https://chat.openai.com" target="_blank" rel="noopener noreferrer">
<img src="https://www.google.com/s2/favicons?sz=128&domain=openai.com">
<p>ChatGPT</p>
</a>
</div>

<div class="card">
<a href="https://chat.openai.com" target="_blank" rel="noopener noreferrer">
<img src="https://www.google.com/s2/favicons?sz=128&domain=runwayml.com">
<p>Runway</p>
</a>
</div>
<h2>My Toolbox</h2>

<button onclick="addMyLink()">+ Add Link</button>

<div class="grid" id="myLinks"></div>
</div>
<script>

function loadLinks(){

let links = JSON.parse(localStorage.getItem("myLinks")) || []

links.forEach(link => createCard(link.name, link.url))

}

function createCard(name, url){

let domain = new URL(url).hostname

let card = document.createElement("div")
card.className = "card"

card.innerHTML = `
<a href="${url}" target="_blank" rel="noopener noreferrer">
<img src="https://www.google.com/s2/favicons?sz=128&domain=${domain}">
<p>${name}</p>
</a>
`

document.getElementById("myLinks").appendChild(card)

}

function addMyLink(){

let name = prompt("Website name")
let url = prompt("Website link")

if(!name || !url) return

let links = JSON.parse(localStorage.getItem("myLinks")) || []

links.push({name, url})

localStorage.setItem("myLinks", JSON.stringify(links))

createCard(name, url)

}

loadLinks()

</script>
</body>
</html>
