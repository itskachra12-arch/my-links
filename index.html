<!DOCTYPE html>
<html>
<head>
<title>Creative Toolbox</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:40px;
}

h1{
font-size:38px;
margin-bottom:10px;
}

h2{
margin-top:40px;
}

.search{
width:100%;
padding:12px;
font-size:16px;
margin-bottom:25px;
border:none;
border-radius:6px;
}

.grid{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.card{
width:160px;
background:#1c1c1c;
border-radius:10px;
padding:12px;
text-align:center;
position:relative;
}

.card img{
width:48px;
height:48px;
border-radius:8px;
margin-bottom:8px;
}

.card small{
color:#aaa;
font-size:12px;
}

.delete{
position:absolute;
top:6px;
right:6px;
background:red;
border:none;
color:white;
border-radius:50%;
width:20px;
height:20px;
cursor:pointer;
}

.favorite{
position:absolute;
top:6px;
left:6px;
font-size:14px;
}

a{
text-decoration:none;
color:white;
}

input,select,textarea{
width:260px;
padding:8px;
border-radius:4px;
border:none;
margin-bottom:8px;
}

textarea{
height:60px;
}

button{
padding:8px 12px;
border:none;
border-radius:4px;
cursor:pointer;
}

#formBox{
margin-top:15px;
display:none;
}

.section{
margin-top:35px;
}

</style>
</head>

<body>

<h1>Creative Toolbox</h1>

<input class="search" id="searchInput" placeholder="Search tools...">

<button onclick="toggleForm()">+ Add Tool</button>
<button onclick="exportTools()">Export</button>
<input type="file" onchange="importTools(event)">

<div id="formBox">

<p>Name</p>
<input id="toolName">

<p>URL</p>
<input id="toolURL">

<p>Description</p>
<textarea id="toolDesc"></textarea>

<p>Category</p>
<select id="toolCategory">
<option>AI</option>
<option>Video</option>
<option>Audio</option>
<option>Design</option>
<option>Productivity</option>
<option>Other</option>
</select>

<p>
<label>
<input type="checkbox" id="toolFav">
Favorite
</label>
</p>

<button onclick="addTool()">Add</button>

</div>

<div class="section">
<h2>⭐ Favorites</h2>
<div class="grid" id="favorites"></div>
</div>

<div class="section">
<h2>AI Tools</h2>
<div class="grid" id="AI"></div>
</div>

<div class="section">
<h2>Video Tools</h2>
<div class="grid" id="Video"></div>
</div>

<div class="section">
<h2>Audio Tools</h2>
<div class="grid" id="Audio"></div>
</div>

<div class="section">
<h2>Design Tools</h2>
<div class="grid" id="Design"></div>
</div>

<div class="section">
<h2>Productivity</h2>
<div class="grid" id="Productivity"></div>
</div>

<div class="section">
<h2>Other</h2>
<div class="grid" id="Other"></div>
</div>

<script>

let tools = JSON.parse(localStorage.getItem("tools")) || []

function toggleForm(){
let f=document.getElementById("formBox")
f.style.display = f.style.display==="none" ? "block" : "none"
}

function addTool(){

let name=document.getElementById("toolName").value.trim()
let url=document.getElementById("toolURL").value.trim()
let desc=document.getElementById("toolDesc").value.trim()
let cat=document.getElementById("toolCategory").value
let fav=document.getElementById("toolFav").checked

if(!name||!url) return

if(!url.startsWith("http")){
url="https://"+url
}

tools.push({name,url,desc,cat,fav})

localStorage.setItem("tools",JSON.stringify(tools))

clearForm()
render()

}

function clearForm(){
document.getElementById("toolName").value=""
document.getElementById("toolURL").value=""
document.getElementById("toolDesc").value=""
document.getElementById("toolFav").checked=false
}

function deleteTool(i){
tools.splice(i,1)
localStorage.setItem("tools",JSON.stringify(tools))
render()
}

function render(){

document.querySelectorAll(".grid").forEach(g=>g.innerHTML="")

tools.forEach((t,i)=>{

let domain
try{domain=new URL(t.url).hostname}catch{domain=t.url}

let card=document.createElement("div")
card.className="card"

card.innerHTML=`
<div class="favorite">${t.fav?"⭐":""}</div>

<button class="delete" onclick="deleteTool(${i})">×</button>

<a href="${t.url}" target="_blank">

<img src="https://www.google.com/s2/favicons?sz=128&domain=${domain}">

<div>${t.name}</div>

<small>${t.desc}</small>

</a>
`

document.getElementById(t.cat).appendChild(card)

if(t.fav){
document.getElementById("favorites").appendChild(card.cloneNode(true))
}

})

}

document.getElementById("searchInput").addEventListener("input",function(){

let s=this.value.toLowerCase()

document.querySelectorAll(".card").forEach(card=>{

let text=card.innerText.toLowerCase()

card.style.display = text.includes(s) ? "block" : "none"

})

})

function exportTools(){

let data=JSON.stringify(tools)

let blob=new Blob([data],{type:"application/json"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="toolbox.json"

a.click()

}

function importTools(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

tools=JSON.parse(reader.result)

localStorage.setItem("tools",JSON.stringify(tools))

render()

}

reader.readAsText(file)

}

render()

</script>

</body>
</html>
