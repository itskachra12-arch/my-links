<!DOCTYPE html>
<html>

<head>
<title>Creative Toolbox</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:40px;
}

h1{
font-size:40px;
margin-bottom:10px;
}

.search{
width:100%;
padding:12px;
font-size:18px;
margin-bottom:30px;
border-radius:6px;
border:none;
}

.grid{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.card{
width:120px;
text-align:center;
position:relative;
padding:10px;
background:#1b1b1b;
border-radius:10px;
}

.card img{
width:60px;
height:60px;
border-radius:10px;
}

.card button{
position:absolute;
top:5px;
right:5px;
background:red;
border:none;
color:white;
cursor:pointer;
border-radius:50%;
width:20px;
height:20px;
font-size:12px;
}

a{
color:white;
text-decoration:none;
}

input{
padding:8px;
width:250px;
border-radius:4px;
border:none;
}

button{
padding:8px 12px;
margin-top:5px;
cursor:pointer;
border:none;
border-radius:4px;
}

#linkForm{
margin-top:15px;
}

</style>
</head>

<body>

<input class="search" id="searchInput" placeholder="Search tools...">

<h1>Creative Toolbox</h1>

<p>My video editing and design resources.</p>

<h2>Public Toolbox</h2>

<div class="grid">

<div class="card">
<a href="https://chat.openai.com" target="_blank">
<img src="https://www.google.com/s2/favicons?sz=128&domain=openai.com">
<p>ChatGPT</p>
</a>
</div>

<div class="card">
<a href="https://runwayml.com" target="_blank">
<img src="https://www.google.com/s2/favicons?sz=128&domain=runwayml.com">
<p>Runway</p>
</a>
</div>

</div>

<h2>My Toolbox</h2>

<button onclick="toggleForm()">+ Add Link</button>

<div id="linkForm" style="display:none;">

<p>Website Name</p>
<input id="linkName">

<p>Website Link</p>
<input id="linkURL">

<br><br>

<button onclick="submitLink()">Add</button>

</div>

<br>

<div class="grid" id="myLinks"></div>

<script>

let links = JSON.parse(localStorage.getItem("myLinks")) || []

function loadLinks(){

document.getElementById("myLinks").innerHTML=""

links.forEach((link,index)=>{

let domain = new URL(link.url).hostname

let card = document.createElement("div")
card.className="card"

card.innerHTML = `
<a href="${link.url}" target="_blank">
<img src="https://www.google.com/s2/favicons?sz=128&domain=${domain}">
<p>${link.name}</p>
</a>

<button onclick="deleteLink(${index})">×</button>
`

document.getElementById("myLinks").appendChild(card)

})

}

function toggleForm(){

let form=document.getElementById("linkForm")

if(form.style.display==="none")
form.style.display="block"
else
form.style.display="none"

}

function submitLink(){

let name=document.getElementById("linkName").value.trim()
let url=document.getElementById("linkURL").value.trim()

if(!name||!url) return

if(!url.startsWith("http")){
url="https://"+url
}

links.push({name,url})

localStorage.setItem("myLinks",JSON.stringify(links))

document.getElementById("linkName").value=""
document.getElementById("linkURL").value=""

loadLinks()

}

}

function deleteLink(index){

links.splice(index,1)

localStorage.setItem("myLinks",JSON.stringify(links))

loadLinks()

}

document.getElementById("searchInput").addEventListener("input",function(){

let search=this.value.toLowerCase()

let cards=document.querySelectorAll(".card")

cards.forEach(card=>{

let text=card.innerText.toLowerCase()

if(text.includes(search))
card.style.display="block"
else
card.style.display="none"

})

})

loadLinks()

</script>

</body>
</html>
